<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Excel CSV automated reporting workflow</title><desc id="desc">Concept diagram of synthetic customer and order inputs flowing through data quality checks into a KPI pack.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171928"/><stop offset="1" stop-color="#31334E"/></linearGradient><pattern id="grid" width="31" height="31" patternUnits="userSpaceOnUse"><path d="M31 0H0V31" fill="none" stroke="#C6CBDC" stroke-opacity=".09"/></pattern></defs><rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/><rect x="56" y="57" width="240" height="33" rx="17" fill="#343751" stroke="#797F9D"/><text x="176" y="79" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#FBBEA6">REPRODUCIBLE REPORTING</text><text x="56" y="179" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#FFFFFF">Reporting</text><text x="56" y="251" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#FBBEA6">Automation</text><text x="57" y="318" font-family="Arial,sans-serif" font-size="21" fill="#C6CBDC">From inconsistent CSV and Excel inputs</text><text x="57" y="350" font-family="Arial,sans-serif" font-size="21" fill="#C6CBDC">to validated, auditable KPI deliveries.</text><rect x="57" y="412" width="500" height="66" rx="18" fill="#343751" stroke="#797F9D"/><text x="307" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#EFFFFF">PYTHON · VALIDATION · EXCEL</text><text x="57" y="557" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.3" fill="#C6CBDC">ARCHITECTURE ILLUSTRATION  /  NOT A LIVE SCREENSHOT</text><g transform="translate(713 83)"><rect width="450" height="449" rx="26" fill="#20263C" stroke="#797F9D" stroke-width="2"/><text x="30" y="56" font-family="Arial,sans-serif" font-size="15" letter-spacing="1.6" font-weight="700" fill="#FBBEA6">CONTROLLED WORKFLOW</text><rect x="30" y="90" width="390" height="88" rx="17" fill="#343751" stroke="#797F9D"/><rect x="48" y="113" width="8" height="42" rx="4" fill="#FBBEA6"/><text x="72" y="127" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Source exports</text><text x="72" y="152" font-family="Arial,sans-serif" font-size="15" fill="#C6CBDC">Sales CSV + customer workbook</text><path d="M222 180v21m-7 -7 7 7 7 -7" fill="none" stroke="#FBBEA6" stroke-width="3"/><rect x="30" y="203" width="390" height="88" rx="17" fill="#343751" stroke="#797F9D"/><rect x="48" y="226" width="8" height="42" rx="4" fill="#FBBEA6"/><text x="72" y="240" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Validation and joins</text><text x="72" y="265" font-family="Arial,sans-serif" font-size="15" fill="#C6CBDC">Schema checks and reference mapping</text><path d="M222 293v21m-7 -7 7 7 7 -7" fill="none" stroke="#FBBEA6" stroke-width="3"/><rect x="30" y="316" width="390" height="88" rx="17" fill="#343751" stroke="#797F9D"/><rect x="48" y="339" width="8" height="42" rx="4" fill="#FBBEA6"/><text x="72" y="353" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">KPI deliverable</text><text x="72" y="378" font-family="Arial,sans-serif" font-size="15" fill="#C6CBDC">Ready-to-review output package</text></g></svg>