name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest suite
        run: python -m pytest -q

      - name: Run complete sample pipeline
        run: python run_demo.py --output "${{ runner.temp }}/agency-demo-outputs"

      - name: Check generated artifacts and reconciliation
        env:
          REPORT_DIR: ${{ runner.temp }}/agency-demo-outputs
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_dir = Path(os.environ["REPORT_DIR"])
          expected = {
              "cleaned_sales.csv",
              "quality_issues.csv",
              "category_kpis.csv",
              "monthly_kpis.csv",
              "segment_kpis.csv",
              "dashboard.html",
              "validation_summary.json",
          }
          missing = expected - {p.name for p in report_dir.iterdir()}
          assert not missing, f"Missing reports: {sorted(missing)}"
          summary = json.loads((report_dir / "validation_summary.json").read_text(encoding="utf-8"))
          assert summary["source_rows"] == summary["valid_rows"] + summary["excluded_rows"]
          assert summary["reconciliation_passed"] is True
          assert summary["source_rows"] == 200
          assert summary["valid_rows"] == 192
          assert summary["excluded_rows"] == 8
          print("All reports generated; synthetic sample reconciles.")
          PY
